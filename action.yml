name: "DLP Secret & PII Scanner"
description: "Scans the repository for secrets and PII and fails the build above a configurable severity."
author: "John-Axe"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Path to scan (default: repository root)."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the action: low, medium, high, critical, none."
    required: false
    default: "high"
  format:
    description: "Output format: table, json, or sarif."
    required: false
    default: "table"
  entropy-threshold:
    description: "Shannon entropy threshold for the entropy detector."
    required: false
    default: "4.3"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.12"
    - name: Install dlp-secret-pii-scanner
      shell: bash
      run: pip install "${{ github.action_path }}"
    - name: Run scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_ENTROPY: ${{ inputs.entropy-threshold }}
      run: |
        dlp-scan "$INPUT_PATH" \
          --fail-on "$INPUT_FAIL_ON" \
          --format "$INPUT_FORMAT" \
          --entropy-threshold "$INPUT_ENTROPY"
