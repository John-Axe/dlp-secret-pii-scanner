name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Run benchmark gate
        run: python benchmark/run_benchmark.py --min-precision 0.85 --min-recall 0.85

      - name: Self-scan the repository
        run: dlp-scan . --format table --fail-on critical

  fuzz:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package and atheris
        run: pip install atheris -e .

      - name: Run fuzz target (smoke, 10 000 iterations)
        run: python fuzz/fuzz_scanner.py -runs=10000

  sarif-self-scan:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Self-scan in SARIF mode
        run: dlp-scan . --baseline .dlp-baseline.json --format sarif --fail-on none > results.sarif

      - name: Upload SARIF to the Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif

  update-badge:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Update benchmark precision/recall badge
        run: |
          python benchmark/run_benchmark.py --min-precision 0.85 --min-recall 0.85 \
            --badge-output .github/badges/benchmark.json

      - name: Commit badge if it changed
        run: |
          if ! git diff --quiet -- .github/badges/benchmark.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/badges/benchmark.json
            git commit -m "chore: update benchmark precision/recall badge [skip ci]"
            git push
          else
            echo "Badge unchanged."
          fi
