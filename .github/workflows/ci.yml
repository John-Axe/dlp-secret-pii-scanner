name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -v

      - name: Run benchmark gate
        run: python benchmark/run_benchmark.py --min-precision 0.85 --min-recall 0.85

      - name: Self-scan the repository
        run: dlp-scan . --format table --fail-on critical
