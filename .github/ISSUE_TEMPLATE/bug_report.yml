name: Bug report
description: Something other than a detector false positive is broken (CLI, CI integration, SARIF output, PR comments, etc).
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the exact command you ran and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dlp-secret-pii-scanner version
      description: Output of `dlp-scan --version` (or the pinned `rev:`/tag if using the pre-commit hook or GitHub Action).
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: How are you running it
      options:
        - CLI directly
        - pre-commit hook
        - GitHub Action
    validations:
      required: true
