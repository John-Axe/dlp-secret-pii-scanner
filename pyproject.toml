[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp-secret-pii-scanner"
version = "0.1.0"
description = "Detects secrets and PII in source trees via CLI, pre-commit hook, or GitHub Action, with a labeled precision/recall benchmark."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "John-Axe" }]
keywords = ["dlp", "secrets", "pii", "security", "pre-commit", "static-analysis"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dlp-scan = "dlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
